  <style>
    body {
      font-family: 'Geist', Arial, sans-serif;
      font-feature-settings: "liga" 1;
    }

    /* For initial page load animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.6s ease-out forwards;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.6s ease-out forwards;
    }

    /* For scroll-triggered animations */
    .scroll-animate {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .scroll-animate.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- Custom Project Page Gradient Backgrounds --- */
    /* This is the base style for the gradient effect element. */
    .project-gradient-base {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1000px;
    }

    /* --- Aurora Background Animations --- */
    @keyframes aurora-1 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(100px, -100px) scale(1.1);
      }

      66% {
        transform: translate(-50px, 80px) scale(0.9);
      }
    }

    @keyframes aurora-2 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(-80px, 120px) scale(1.1);
      }

      66% {
        transform: translate(60px, -60px) scale(0.9);
      }
    }

    @keyframes aurora-3 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(120px, 80px) scale(1.1);
      }

      66% {
        transform: translate(-80px, -120px) scale(0.9);
      }
    }

    .animate-aurora-1 {
      animation: aurora-1 20s infinite alternate ease-in-out;
    }

    .animate-aurora-2 {
      animation: aurora-2 25s infinite alternate ease-in-out;
    }

    .animate-aurora-3 {
      animation: aurora-3 18s infinite alternate ease-in-out;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% center;
      }

      100% {
        background-position: -200% center;
      }
    }

    @keyframes retro-progress {
      from {
        width: 100%;
      }

      to {
        width: 0%;
      }
    }

    @keyframes gradient-flow {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .animate-gradient-flow {
      animation: gradient-flow 6s ease infinite;
      background-size: 300% 300%;
    }


    /* Add new gradient color classes here. The start color should be a light tint.
         For consistency, you can use the same hex codes defined for the 'highlight-*-bg'
         colors in the tailwind.config below. */
    .gradient-purple {
      background: linear-gradient(180deg, #f5f0ff 0%, #ffffff 80%);
    }

    .gradient-blue {
      background: linear-gradient(180deg, #ebf5ff 0%, #ffffff 80%);
    }

    .gradient-green {
      background: linear-gradient(180deg, #ebfdf4 0%, #ffffff 80%);
    }

    .gradient-yellow {
      background: linear-gradient(180deg, #fef9eb 0%, #ffffff 80%);
    }

    .gradient-red {
      background: linear-gradient(180deg, #fff0ef 0%, #ffffff 80%);
    }

    .gradient-gray {
      background: linear-gradient(180deg, #f5f5f5 0%, #ffffff 80%);
    }

    /* --- Retro Mode Easter Egg --- */
    body.retro-mode {
      font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", sans-serif !important;
      background-color: #000080 !important;
      /* Windows 95 Blue */
      color: #00FF00 !important;
      /* Matrix Green / Retro Terminal */
      cursor: crosshair !important;
    }

    body.retro-mode * {
      border-radius: 0 !important;
      /* No rounded corners in the 90s! */
      box-shadow: none !important;
    }

    body.retro-mode h1,
    body.retro-mode h2,
    body.retro-mode h3 {
      font-family: "Courier New", Courier, monospace !important;
      color: #FFFF00 !important;
      /* Neon Yellow */
      text-shadow: 2px 2px #FF0000 !important;
      /* Red shadow */
    }

    body.retro-mode .bg-brand-card,
    body.retro-mode header,
    body.retro-mode footer {
      background-color: #C0C0C0 !important;
      /* Win 95 Gray */
      border: 4px outset #FFFFFF !important;
      color: #000000 !important;
    }

    body.retro-mode button,
    body.retro-mode a {
      text-decoration: underline !important;
      color: #0000FF !important;
      /* Hyperlink Blue */
    }

    body.retro-mode img,
    body.retro-mode svg {
      filter: contrast(150%) hue-rotate(90deg) !important;
    }

    /* Wiggle animation for attention */
    @keyframes wiggle {
      0% {
        transform: rotate(0deg);
      }

      5% {
        transform: rotate(-15deg);
      }

      10% {
        transform: rotate(15deg);
      }

      15% {
        transform: rotate(-15deg);
      }

      20% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    .animate-wiggle {
      animation: wiggle 2s ease-in-out infinite;
      display: inline-block;
      /* Ensure transforms work */
      position: relative;
    }

    /* Spark animation */
    @keyframes spark-fade {

      0%,
      80% {
        opacity: 0;
        transform: scale(0);
      }

      85% {
        opacity: 1;
        transform: scale(0.5);
      }

      100% {
        opacity: 0;
        transform: scale(0);
      }
    }

    .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #FCD34D;
      /* Amber-300 */
      box-shadow: 0 0 4px #F59E0B;
      /* Amber-500 glow */
      opacity: 0;
      animation: spark-fade 2s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }
  </style>

            'project-h3': ['28px', { lineHeight: '1.4' }],

            'subheading': '-0.03em',
            'card-title': '-0.02em',
          },
          boxShadow: {
            'border': '0px 0px 0px 1px rgba(0,0,0,0.08)',
            'card': '0px 0px 0px 1px rgba(0,0,0,0.08), 0px 2px 2px rgba(0,0,0,0.04), 0px 8px 8px -8px rgba(0,0,0,0.04), 0px 0px 0px 1px #fafafa inset',

          }
        }
      }
    }
