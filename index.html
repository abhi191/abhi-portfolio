  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* For initial page load animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.6s ease-out forwards;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.6s ease-out forwards;
    }

    /* For scroll-triggered animations */
    .scroll-animate {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .scroll-animate.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- Custom Project Page Gradient Backgrounds --- */
    /* This is the base style for the gradient effect element. */
    .project-gradient-base {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1000px;
    }

    /* --- Aurora Background Animations --- */
    @keyframes aurora-1 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(100px, -100px) scale(1.1);
      }

      66% {
        transform: translate(-50px, 80px) scale(0.9);
      }
    }

    @keyframes aurora-2 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(-80px, 120px) scale(1.1);
      }

      66% {
        transform: translate(60px, -60px) scale(0.9);
      }
    }

    @keyframes aurora-3 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(120px, 80px) scale(1.1);
      }

      66% {
        transform: translate(-80px, -120px) scale(0.9);
      }
    }

    .animate-aurora-1 {
      animation: aurora-1 20s infinite alternate ease-in-out;
    }

    .animate-aurora-2 {
      animation: aurora-2 25s infinite alternate ease-in-out;
    }

    .animate-aurora-3 {
      animation: aurora-3 18s infinite alternate ease-in-out;
    }


    /* Add new gradient color classes here. The start color should be a light tint.
         For consistency, you can use the same hex codes defined for the 'highlight-*-bg'
         colors in the tailwind.config below. */
    .gradient-purple {
      background: linear-gradient(180deg, #F3E8FF 0%, #FBFBFB 80%);
    }

    .gradient-blue {
      background: linear-gradient(180deg, #DBEAFE 0%, #FBFBFB 80%);
    }

    .gradient-green {
      background: linear-gradient(180deg, #D1FAE5 0%, #FBFBFB 80%);
    }

    .gradient-yellow {
      background: linear-gradient(180deg, #FEF3C7 0%, #FBFBFB 80%);
    }

    .gradient-red {
      background: linear-gradient(180deg, #FEE2E2 0%, #FBFBFB 80%);
    }

    .gradient-gray {
      background: linear-gradient(180deg, #E5E7EB 0%, #FBFBFB 80%);
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {

            'brand-background': '#FBFBFB',
            'brand-card': '#F0F0F0',
            'brand-dark': '#1C1C1C',
            'brand-accent': '#A15DD9',
            'brand-highlight': '#F3E8FF',

            // -- Custom Text Highlight Colors --
            // Add new highlight colors here. For each new color 'NAME',
            // add a 'highlight-NAME-bg' and 'highlight-NAME-text'.
            'highlight-red-bg': '#FEE2E2',    // Corresponds to Tailwind's red-100
            'highlight-red-text': '#991B1B',  // Corresponds to Tailwind's red-900
            'highlight-yellow-bg': '#FEF3C7', // Corresponds to Tailwind's yellow-100 (default)
            'highlight-yellow-text': '#78350F',// Corresponds to Tailwind's yellow-900
            'highlight-green-bg': '#D1FAE5',  // Corresponds to Tailwind's green-100
            'highlight-green-text': '#065F46', // Corresponds to Tailwind's green-900
            'highlight-blue-bg': '#DBEAFE',   // Corresponds to Tailwind's blue-100
            'highlight-blue-text': '#1E40AF',  // Corresponds to Tailwind's blue-900
            'highlight-gray-bg': '#E5E7EB',   // Corresponds to Tailwind's gray-200
            'highlight-gray-text': '#1F2937',  // Corresponds to Tailwind's gray-800

            // Example of a new custom color:
            'highlight-purple-bg': '#F3E8FF',
            'highlight-purple-text': '#6B21A8',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
            display: ['"Paytone One"', '"Archivo Black"', 'sans-serif'],
          },
          fontSize: {
            'project-h1': ['38px', { lineHeight: '1.2' }],
            'project-h2': ['36px', { lineHeight: '1.3' }],
            'project-h3': ['28px', { lineHeight: '1.4' }],
            'project-h4': ['22px', { lineHeight: '1.5' }],
          }
        }
      }
    }
  </script>
